# PHQ-9 depression screener. The PHQ family was developed by Drs. Spitzer, Williams, Kroenke and
# colleagues with an educational grant from Pfizer; no permission is required to reproduce, translate,
# display or distribute it (see phqscreeners.com). Item WORDING is not reproduced here - item ids only.
instrument_id: PHQ9
title: Patient Health Questionnaire-9
license: public_domain
fake: false
items: [phq1, phq2, phq3, phq4, phq5, phq6, phq7, phq8, phq9]
item_min: 0            # "not at all"
item_max: 3            # "nearly every day"
reverse_items: []
max_missing_items: 1   # prorate when <= 1 item is missing: mean of answered items x 9
higher_is_worse: true
bands:                 # total score severity bands (lower bound inclusive)
  - {min: 0, label: minimal}
  - {min: 5, label: mild}
  - {min: 10, label: moderate}
  - {min: 15, label: moderately severe}
  - {min: 20, label: severe}
mcid: 5                # commonly used minimal clinically important difference (points)
